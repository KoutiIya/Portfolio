<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Koutilya Karamala</title>
  <style>
    @font-face {
      font-family: 'Elza';
      src: url('fonts/fonnts.com-Elza_Text_Light.otf') format('opentype');
      font-weight: 300;
      font-style: normal;
    }

    @font-face {
      font-family: 'Elza';
      src: url('fonts/fonnts.com-Elza_Text_Medium.otf') format('opentype');
      font-weight: 500;
      font-style: normal;
    }

    *, *::before, *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --bg: #161416;
      --accent: #aecafa;
      --white: rgba(255, 255, 255, 0.75);
      --font: 'Elza', Georgia, serif;
    }

    html, body {
      width: 100%;
      height: 100%;
    }

    body {
      background-color: var(--bg);
      font-family: var(--font);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      padding: 28px 36px;
      display: flex;
      align-items: center;
      gap: 10px;
      opacity: 0;
      animation: fadeIn 1s ease 0.2s forwards;
    }

    .name {
      font-family: var(--font);
      font-size: 13px;
      font-weight: 300;
      letter-spacing: 0.04em;
      color: var(--white);
      text-decoration: none;
    }

    main {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      animation: fadeIn 1.2s ease 0.5s forwards;
    }

    .coming-soon {
      font-family: var(--font);
      font-size: clamp(48px, 10vw, 120px);
      font-weight: 500;
      color: var(--accent);
      letter-spacing: -0.02em;
      line-height: 1;
      text-align: center;
    }

    footer {
      position: fixed;
      bottom: 0;
      right: 0;
      padding: 28px 36px;
      opacity: 0;
      animation: fadeIn 1s ease 0.2s forwards;
    }

    .linkedin-link {
      display: flex;
      align-items: center;
      color: var(--white);
      text-decoration: none;
      transition: color 0.2s ease;
    }

    .linkedin-link:hover {
      color: var(--accent);
    }

    .linkedin-link svg {
      width: 18px;
      height: 18px;
      fill: currentColor;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to   { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>

  <header>
    <span class="name">Koutilya Karamala</span>
  </header>

  <main>
    <h1 class="coming-soon">Coming Soon</h1>
  </main>

  <footer>
    <a class="linkedin-link" href="https://www.linkedin.com/in/koutilya-karamala-a9b812314/" target="_blank" rel="noopener noreferrer" aria-label="LinkedIn">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
        <path d="M20.447 20.452h-3.554v-5.569c0-1.328-.027-3.037-1.852-3.037-1.853 0-2.136 1.445-2.136 2.939v5.667H9.351V9h3.414v1.561h.046c.477-.9 1.637-1.85 3.37-1.85 3.601 0 4.267 2.37 4.267 5.455v6.286zM5.337 7.433a2.062 2.062 0 0 1-2.063-2.065 2.064 2.064 0 1 1 2.063 2.065zm1.782 13.019H3.555V9h3.564v11.452zM22.225 0H1.771C.792 0 0 .774 0 1.729v20.542C0 23.227.792 24 1.771 24h20.451C23.2 24 24 23.227 24 22.271V1.729C24 .774 23.2 0 22.222 0h.003z"/>
      </svg>
    </a>
  </footer>

</body>
</html>
